org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Maven coordinates: io.github.appshipkit:<module>:<version>. Versions follow AndroidX style:
# 1.2.0 for stable releases, 1.2.0-alpha01 / -beta01 / -rc01 for pre-releases (see scripts/bump-version.sh).
GROUP=io.github.appshipkit
VERSION_NAME=1.1.0

# POM metadata shared by every published module (each module sets POM_ARTIFACT_ID, POM_NAME, POM_DESCRIPTION)
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/appshipkit/devdeck
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://github.com/appshipkit/devdeck/blob/main/LICENSE
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/appshipkit/devdeck
POM_SCM_CONNECTION=scm:git:git://github.com/appshipkit/devdeck.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/appshipkit/devdeck.git
POM_DEVELOPER_ID=appshipkit
POM_DEVELOPER_NAME=AppShipKit
POM_DEVELOPER_URL=https://github.com/appshipkit
