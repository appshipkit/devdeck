name: Publish to Maven Central

# Publishes an already released version that isn't on Maven Central yet, from a branch made from its tag
# with the Maven Central setup added (e.g. central/v1.0.0). New versions are published by the Release workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to publish, e.g. central/v1.0.0"
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check version
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]{2})?$ ]]; then
            echo "::error::VERSION_NAME=${version} isn't X.Y.Z or X.Y.Z-(alpha|beta|rc)NN"
            exit 1
          fi
          # Only versions that were already released and tagged; the Release workflow handles new ones.
          if ! git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::v${version} isn't tagged; release new versions with Bump version instead"
            exit 1
          fi
          echo "Publishing ${version} from ${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build and test
        run: ./gradlew assembleRelease testDebugUnitTest

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
