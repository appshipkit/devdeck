name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a CHANGELOG.md entry
        env:
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "skip-changelog label set"
            exit 0
          fi
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated"
          else
            echo "::error::Add an entry under [Unreleased] in CHANGELOG.md, or add the skip-changelog label."
            exit 1
          fi
